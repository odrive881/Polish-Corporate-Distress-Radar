[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polish-corporate-distress-radar"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/distress_radar"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
