[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polish-corporate-distress-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "hishel[async]>=1.3",
    "pyrate-limiter>=4.5",
    "tenacity>=9.0",
    "zeep>=4.3",
    "boto3>=1.35",
    "lxml>=5.3",
    "pyyaml>=6.0",
    "psycopg[binary,pool]>=3.2",
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "marimo>=0.9",
    "boto3-stubs[s3]>=1.35",
    "types-pyyaml>=6.0",
    "lxml-stubs>=0.5",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/distress_radar"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not integration'"
markers = [
    "integration: needs live compose services (make dev-up); run with make test-integration",
]
