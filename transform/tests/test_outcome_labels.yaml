# Outcome labels (plan 0008 step G, plan 0009; AGENT_SPEC §9.2 "Label construction"). Fixtures, never the
# live seed. `vars` shrink the grid: month-ends from 2012-01-31, horizons of 1 and 2 months,
# one source (KRS), a regime window of March 2012, and KRZ "launching" on 2012-03-01. Window
# ends: 01-31 → 02-29 (h1) / 03-31 (h2); 02-29 → 03-31 / 04-30; 03-31 → 04-30 / 05-31;
# 04-30 → 05-31 / 06-30.

test_classes_censoring_exclusion_and_flags:
  model: staging.outcome_label_grid
  vars: &vars
    label_grid_start: "2012-01-31"
    label_horizons: "1,2"
    label_sources: KRS
    label_precedence: bankruptcy,restructuring,liquidation,silent_exit
    regime_start: "2012-03-01"
    regime_end: "2012-03-31"
    krz_launch: "2012-03-01"
    label_version: test_v
    # Version 1 behaviour: no lag allowance, petitions never expire (plan 0009 tests set them).
    label_alive_lag_months: 0
    label_petition_expiry_months: null
  inputs:
    ext.entity_master:
      rows:
        - {krs: "000000000A"}
        - {krs: "000000000C"}
    ext.legal_source_fetches:
      rows:
        - {krs: "000000000A", source: KRS, fetched_at: "2012-04-30 12:00:00+00"}
        - {krs: "000000000C", source: KRS, fetched_at: "2012-02-29 12:00:00+00"}
        - {krs: "000000000C", source: MSiG, fetched_at: "2012-01-01 12:00:00+00"}  # not a label source here
    staging.legal_events_canonical:
      rows:
        - {dedup_group_id: a0, krs: "000000000A", event_type: registered, stage: signal, ends: [], effective_date: 2005-01-01, known_from: 2005-01-01}
        - {dedup_group_id: a1, krs: "000000000A", event_type: bankruptcy_declared, outcome_class: bankruptcy, stage: opening, ends: [], event_date: 2012-03-10, known_from: 2012-03-20, effective_date: 2012-03-10, proceeding_id: P1, label_class: bankruptcy}
  outputs:
    query:
      partial: true
      rows:
        # A: alive before the bankruptcy is in view; labelled while it is ahead; excluded after.
        - {krs: "000000000A", as_of_date: 2012-01-31, horizon_months: 1, excluded_reason: null, outcome_class: alive, censored: false, trigger_event_type: null, proceeding_id: null, regime_flag: false, source_era: pre_krz}
        - {krs: "000000000A", as_of_date: 2012-01-31, horizon_months: 2, excluded_reason: null, outcome_class: bankruptcy, censored: false, trigger_event_type: bankruptcy_declared, proceeding_id: P1, regime_flag: true, source_era: mixed}
        - {krs: "000000000A", as_of_date: 2012-02-29, horizon_months: 1, excluded_reason: null, outcome_class: bankruptcy, censored: false, trigger_event_type: bankruptcy_declared, proceeding_id: P1, regime_flag: true, source_era: krz}
        - {krs: "000000000A", as_of_date: 2012-02-29, horizon_months: 2, excluded_reason: null, outcome_class: bankruptcy, censored: false, trigger_event_type: bankruptcy_declared, proceeding_id: P1, regime_flag: true, source_era: krz}
        - {krs: "000000000A", as_of_date: 2012-03-31, horizon_months: 1, excluded_reason: in_proceeding, outcome_class: alive, censored: false, trigger_event_type: null, proceeding_id: null, regime_flag: false, source_era: krz}
        - {krs: "000000000A", as_of_date: 2012-03-31, horizon_months: 2, excluded_reason: in_proceeding, outcome_class: null, censored: true, trigger_event_type: null, proceeding_id: null, regime_flag: false, source_era: krz}
        - {krs: "000000000A", as_of_date: 2012-04-30, horizon_months: 1, excluded_reason: in_proceeding, outcome_class: null, censored: true, trigger_event_type: null, proceeding_id: null, regime_flag: false, source_era: krz}
        - {krs: "000000000A", as_of_date: 2012-04-30, horizon_months: 2, excluded_reason: in_proceeding, outcome_class: null, censored: true, trigger_event_type: null, proceeding_id: null, regime_flag: false, source_era: krz}
        # C: no event. Alive only while the window ends by the cutoff (02-29), censored after.
        - {krs: "000000000C", as_of_date: 2012-01-31, horizon_months: 1, excluded_reason: null, outcome_class: alive, censored: false, trigger_event_type: null, proceeding_id: null, regime_flag: false, source_era: pre_krz}
        - {krs: "000000000C", as_of_date: 2012-01-31, horizon_months: 2, excluded_reason: null, outcome_class: null, censored: true, trigger_event_type: null, proceeding_id: null, regime_flag: true, source_era: mixed}
