        - {krs: "000000000F", as_of_date: 2012-01-31, horizon_months: 2, excluded_reason: in_proceeding, outcome_class: null, censored: true, trigger_event_type: null}
        - {krs: "000000000F", as_of_date: 2012-02-29, horizon_months: 1, excluded_reason: in_proceeding, outcome_class: null, censored: true, trigger_event_type: null}
        - {krs: "000000000F", as_of_date: 2012-02-29, horizon_months: 2, excluded_reason: in_proceeding, outcome_class: null, censored: true, trigger_event_type: null}

test_silent_exit_versus_deregistration_after_bankruptcy_and_an_undated_event:
  model: staging.outcome_label_grid
  vars: *vars
  inputs:
    ext.entity_master:
      rows:
        - {krs: "000000000D"}
        - {krs: "000000000E"}
        - {krs: "000000000G"}
    ext.legal_source_fetches:
      rows:
        - {krs: "000000000D", source: KRS, fetched_at: "2012-02-29 12:00:00+00"}
        - {krs: "000000000E", source: KRS, fetched_at: "2012-02-29 12:00:00+00"}
        - {krs: "000000000G", source: KRS, fetched_at: "2012-02-29 12:00:00+00"}
    staging.legal_events_canonical:
      rows:
        # D: deregistered with nothing before it: a silent exit.
        - {dedup_group_id: d1, krs: "000000000D", event_type: deregistered, outcome_class: silent_exit, stage: exit, ends: [bankruptcy, restructuring, liquidation], event_date: 2012-02-10, known_from: 2012-02-10, effective_date: 2012-02-10, label_class: silent_exit}
        # E: a bankruptcy that ended before the grid, then the deregistration: labelled bankruptcy.
        - {dedup_group_id: e1, krs: "000000000E", event_type: bankruptcy_declared, outcome_class: bankruptcy, stage: opening, ends: [], event_date: 2011-06-01, known_from: 2011-06-10, effective_date: 2011-06-01, proceeding_id: P5, label_class: bankruptcy}
        - {dedup_group_id: e2, krs: "000000000E", event_type: bankruptcy_proceeding_ended, stage: closing, ends: [bankruptcy], event_date: 2011-12-01, known_from: 2011-12-10, effective_date: 2011-12-01, proceeding_id: P5}
        - {dedup_group_id: e3, krs: "000000000E", event_type: deregistered, outcome_class: silent_exit, stage: exit, ends: [bankruptcy, restructuring, liquidation], event_date: 2012-02-10, known_from: 2012-02-10, effective_date: 2012-02-10, proceeding_id: P5, label_class: bankruptcy}
        # G: a declaration with no decision date, known 2012-02-20: on or before then.
        - {dedup_group_id: g1, krs: "000000000G", event_type: bankruptcy_declared, outcome_class: bankruptcy, stage: opening, ends: [], event_date: null, known_from: 2012-02-20, effective_date: 2012-02-20, label_class: bankruptcy}
  outputs:
    query:
      partial: true
      rows:
        - {krs: "000000000D", as_of_date: 2012-01-31, horizon_months: 1, excluded_reason: null, outcome_class: silent_exit, trigger_event_type: deregistered, proceeding_id: null, proceeding_id_note: procedure_has_no_case, event_date: 2012-02-10, event_known_from: 2012-02-10}
