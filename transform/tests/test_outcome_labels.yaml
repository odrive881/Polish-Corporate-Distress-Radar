        - {krs: "000000000F"}
    ext.legal_source_fetches:
      rows:
        - {krs: "000000000B", source: KRS, fetched_at: "2012-02-29 12:00:00+00"}
        - {krs: "000000000F", source: KRS, fetched_at: "2012-02-29 12:00:00+00"}
    staging.legal_events_canonical:
      rows:
        # B: a restructuring and a liquidation on the same day; precedence gives restructuring.
        - {dedup_group_id: b1, krs: "000000000B", event_type: liquidation_opened, outcome_class: liquidation, stage: opening, ends: [], event_date: 2012-02-15, known_from: 2012-02-20, effective_date: 2012-02-15, label_class: liquidation}
