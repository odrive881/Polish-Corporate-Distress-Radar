test_canonical_events:
  model: staging.legal_events_canonical
  inputs:
    ext.legal_events:
      rows:
        # One opening seen twice: the specific type wins, the earliest publication, one date.
        - {krs: "000000000X", event_type: restructuring_proceedings_opened, outcome_class: restructuring, stage: opening, ends: [], precludes_silent_exit: true, event_date: 2021-07-02, known_from: 2021-10-22, source: KRS, proceeding_id: P, dedup_group_id: x1}
        - {krs: "000000000X", event_type: remedial_proceedings_opened, outcome_class: restructuring, stage: opening, ends: [], precludes_silent_exit: true, event_date: 2021-07-02, known_from: 2021-07-15, source: MSiG, proceeding_id: P, dedup_group_id: x1}
        # Y: deregistered with nothing before: silent exit.
        - {krs: "000000000Y", event_type: deregistered, outcome_class: silent_exit, stage: exit, ends: [bankruptcy, restructuring, liquidation], precludes_silent_exit: false, event_date: 2022-10-31, known_from: 2022-10-31, source: KRS, dedup_group_id: y1}
        # Z: bankruptcy, ended, deregistered: the deregistration takes the bankruptcy's class and case.
        - {krs: "000000000Z", event_type: bankruptcy_declared, outcome_class: bankruptcy, stage: opening, ends: [], precludes_silent_exit: true, event_date: 2017-03-08, known_from: 2017-03-17, source: MSiG, proceeding_id: Q, dedup_group_id: z1}
        - {krs: "000000000Z", event_type: bankruptcy_proceeding_ended, stage: closing, ends: [bankruptcy], precludes_silent_exit: false, event_date: 2021-07-27, known_from: 2021-08-05, source: MSiG, proceeding_id: Q, dedup_group_id: z2}
        - {krs: "000000000Z", event_type: deregistered, outcome_class: silent_exit, stage: exit, ends: [bankruptcy, restructuring, liquidation], precludes_silent_exit: false, event_date: 2021-11-19, known_from: 2021-11-19, source: KRS, dedup_group_id: z3}
        # W: merged away: the deregistration is no outcome.
        - {krs: "000000000W", event_type: merger_division_transformation, stage: signal, ends: [], precludes_silent_exit: true, event_date: 2008-12-29, known_from: 2009-01-02, source: KRS, dedup_group_id: w1}
        - {krs: "000000000W", event_type: deregistered, outcome_class: silent_exit, stage: exit, ends: [bankruptcy, restructuring, liquidation], precludes_silent_exit: false, event_date: 2012-01-15, known_from: 2012-01-15, source: KRS, dedup_group_id: w2}
        # V: undated: effective on the day it became known.
        - {krs: "000000000V", event_type: bankruptcy_declared, outcome_class: bankruptcy, stage: opening, ends: [], precludes_silent_exit: true, event_date: null, known_from: 2025-08-13, source: KRS, dedup_group_id: v1}
  outputs:
    query:
      partial: true
      rows:
        - {dedup_group_id: v1, event_type: bankruptcy_declared, known_from: 2025-08-13, effective_date: 2025-08-13, proceeding_id: null, label_class: bankruptcy}
        - {dedup_group_id: w1, event_type: merger_division_transformation, known_from: 2009-01-02, effective_date: 2008-12-29, proceeding_id: null, label_class: null}
        - {dedup_group_id: w2, event_type: deregistered, known_from: 2012-01-15, effective_date: 2012-01-15, proceeding_id: null, label_class: merged_away}
        - {dedup_group_id: x1, event_type: remedial_proceedings_opened, known_from: 2021-07-15, effective_date: 2021-07-02, proceeding_id: P, label_class: restructuring}
        - {dedup_group_id: y1, event_type: deregistered, known_from: 2022-10-31, effective_date: 2022-10-31, proceeding_id: null, label_class: silent_exit}
        - {dedup_group_id: z1, event_type: bankruptcy_declared, known_from: 2017-03-17, effective_date: 2017-03-08, proceeding_id: Q, label_class: bankruptcy}
        - {dedup_group_id: z2, event_type: bankruptcy_proceeding_ended, known_from: 2021-08-05, effective_date: 2021-07-27, proceeding_id: Q, label_class: null}
        - {dedup_group_id: z3, event_type: deregistered, known_from: 2021-11-19, effective_date: 2021-11-19, proceeding_id: Q, label_class: bankruptcy}

# --- version 2 (plan 0009) ---------------------------------------------------------------------
# Same small grid, with KRZ "launching" on 2012-03-01 and a cutoff of 2012-06-30.
#
# The lag allowance: 1 month. A window ending before the launch (01-31 h1 → 02-29) may be alive
# up to the cutoff; one ending on or after it only up to 2012-05-30 (06-30 minus a month).
test_lag_allowance_censors_recent_windows_after_the_launch:
  model: staging.outcome_label_grid
  vars:
    <<: *vars
    label_alive_lag_months: 1
  inputs:
    ext.entity_master:
      rows:
        - {krs: "000000000L"}
    ext.legal_source_fetches:
      rows:
        - {krs: "000000000L", source: KRS, fetched_at: "2012-06-30 12:00:00+00"}
    staging.legal_events_canonical:
      rows: []
  outputs:
    query:
      partial: true
      rows:
        - {krs: "000000000L", as_of_date: 2012-01-31, horizon_months: 1, outcome_class: alive, censored: false}
        - {krs: "000000000L", as_of_date: 2012-01-31, horizon_months: 2, outcome_class: alive, censored: false}
        - {krs: "000000000L", as_of_date: 2012-02-29, horizon_months: 1, outcome_class: alive, censored: false}
        - {krs: "000000000L", as_of_date: 2012-02-29, horizon_months: 2, outcome_class: alive, censored: false}
        # Ends 04-30: the last window the lag allows. Those ending 05-31 are one day past it.
        - {krs: "000000000L", as_of_date: 2012-03-31, horizon_months: 1, outcome_class: alive, censored: false}
        - {krs: "000000000L", as_of_date: 2012-03-31, horizon_months: 2, outcome_class: null, censored: true}
        - {krs: "000000000L", as_of_date: 2012-04-30, horizon_months: 1, outcome_class: null, censored: true}
        - {krs: "000000000L", as_of_date: 2012-04-30, horizon_months: 2, outcome_class: null, censored: true}
        - {krs: "000000000L", as_of_date: 2012-05-31, horizon_months: 1, outcome_class: null, censored: true}
        - {krs: "000000000L", as_of_date: 2012-05-31, horizon_months: 2, outcome_class: null, censored: true}
        - {krs: "000000000L", as_of_date: 2012-06-30, horizon_months: 1, outcome_class: null, censored: true}
        - {krs: "000000000L", as_of_date: 2012-06-30, horizon_months: 2, outcome_class: null, censored: true}

