        - {krs: "000000000D", as_of_date: 2012-02-29, horizon_months: 1, excluded_reason: deregistered, outcome_class: null, trigger_event_type: null, proceeding_id: null, proceeding_id_note: null, event_date: null, event_known_from: null}
        - {krs: "000000000D", as_of_date: 2012-02-29, horizon_months: 2, excluded_reason: deregistered, outcome_class: null, trigger_event_type: null, proceeding_id: null, proceeding_id_note: null, event_date: null, event_known_from: null}
        - {krs: "000000000E", as_of_date: 2012-01-31, horizon_months: 1, excluded_reason: null, outcome_class: bankruptcy, trigger_event_type: deregistered, proceeding_id: P5, proceeding_id_note: null, event_date: 2012-02-10, event_known_from: 2012-02-10}
        - {krs: "000000000E", as_of_date: 2012-01-31, horizon_months: 2, excluded_reason: null, outcome_class: bankruptcy, trigger_event_type: deregistered, proceeding_id: P5, proceeding_id_note: null, event_date: 2012-02-10, event_known_from: 2012-02-10}
