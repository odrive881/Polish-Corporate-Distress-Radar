  outputs:
    query:
      rows:
        - {stage: G1, entity_key: "0000000007:ref7", krs: "0000000007", document_ref: ref7, source_document_hash: h7, source_member: "zip:7.xml", reason_codes: [pdf_encrypted], known_from: 2024-06-30, first_detected_at: "2026-09-30 08:00:00+00"}
        - {stage: G2, entity_key: "0000000007:ref7:litigation", krs: "0000000007", document_ref: ref7, source_document_hash: h7, source_member: "zip:7.xml", reason_codes: [evidence_not_on_page], known_from: 2024-06-30, first_detected_at: "2026-09-30 08:00:00+00"}
