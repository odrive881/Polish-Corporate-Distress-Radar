# KSH loss tripwires, version 2 (plan 0023, § "The Art. 233 tripwire", owner 2026-10-23).
# Version 1 (`ksh_tripwires.yaml`) stays as the record and is what feature sets v1-v7 read; a set
# names this file with `ksh_tripwires: ksh_tripwires_v2` (feature_set_v8 on).
#
# What changed from version 1, and why. 90 filings in the store (2026-10-23) carry a negative share
# capital: the filer booked the accumulated losses on the share-capital line and left the prior
# years' result at zero (`sign_check_v1`, `sign_suspected`). The equity total still adds up, but
# version 1 read the loss as A.V + A.VI and the threshold from a negative capital: triggered, by the
# negative threshold rather than the loss, and null whenever a breakdown line was not filed. Two
# additions:
# - `negative_equity`: when total equity is below zero and the offsets (revaluation reserve,
#   write-offs from net profit) sum to zero or more, the rule is triggered without reading the
#   split. Equity = threshold capitals + offsets + the accumulated result, and the law keeps the
#   capitals at or above zero (share capital at least 5,000 zł, KSH art. 154), so the loss then
#   exceeds them in full, let alone the threshold. This reads total equity, which every form
#   carries: micro filers, null under version 1 (no equity breakdown), are triggered when their
#   equity is negative.
# - `non_negative`: with equity at or above zero, a capital filed below zero leaves the split
#   between capital and loss unknown, so the rule is null, never guessed (invariant 4).
#
# Loaded and cross-checked by `distress_radar.features.statutory.load_ksh_tripwires`.
#
# A rule is resolved on the balance-sheet date of the statement it is applied to: that is the
# balance sheet "drawn up by the board" the article speaks of. A date before every rule's
# `effective_from` resolves to nothing, and the feature is null.
#
# Each rule compares losses with a threshold, both named by the ratio inputs of
# `config/features/line_items_*.yaml`:
# - `losses`: the inputs whose sum, when negative, is the loss (its absolute value). A positive
#   sum is no loss, and the rule is not triggered.
# - `threshold`: input → coefficient, as a fraction ("1/2", "1/3"), so the comparison is exact.
# The rule is triggered when the loss is *strictly greater* than the threshold ("przewyższającą").
# An input of `losses` or `threshold` the statement does not carry makes the comparison null, never
# zero (invariant 4): micro forms carry no equity breakdown, so for a micro filing the rule is read
# from `negative_equity` alone, and is null when its equity is not negative.

version: 2

statutes:
  - id: ksh_2000
    act: Ustawa z 15 września 2000 r. — Kodeks spółek handlowych
    effective_from: 2001-01-01

rules:
  # Art. 233 § 1: "Jeżeli bilans sporządzony przez zarząd wykaże stratę przewyższającą sumę kapitałów
  # zapasowego i rezerwowych oraz połowę kapitału zakładowego, zarząd jest obowiązany niezwłocznie
  # zwołać zgromadzenie wspólników w celu powzięcia uchwały dotyczącej dalszego istnienia spółki."
  #
  # The loss is the accumulated loss on the balance sheet: the prior years' result plus the year's
  # (plan 0010 decision 6). "Kapitały rezerwowe" is read as the balance sheet's "pozostałe kapitały
  # rezerwowe" (A.IV). The revaluation reserve (A.III) is left out: it holds unrealised revaluation
  # gains, and commentaries differ on counting it. Adding it is one line here, and a new version.
  - rule: art_233
    legal_forms: [sp_z_oo]
    statute: ksh_2000
    losses: [retained_result, net_result_balance_sheet]
    threshold:
      supplementary_capital: "1"
      reserve_capital: "1"
      share_capital: "1/2"
    negative_equity:
      equity: equity
      offsets: [revaluation_reserve, profit_write_offs]
    non_negative: [share_capital, supplementary_capital, reserve_capital]

  # Art. 397: the same test for a spółka akcyjna, with a third of the share capital. Not used in v1
  # (sp. z o.o. only); kept so the S.A. scope needs no new code (AGENT_SPEC §4.5).
  - rule: art_397
    legal_forms: [sa]
    statute: ksh_2000
    losses: [retained_result, net_result_balance_sheet]
    threshold:
      supplementary_capital: "1"
      reserve_capital: "1"
      share_capital: "1/3"
    negative_equity:
      equity: equity
      offsets: [revaluation_reserve, profit_write_offs]
    non_negative: [share_capital, supplementary_capital, reserve_capital]
