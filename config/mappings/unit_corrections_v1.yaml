    source_member: "zip:id-5496039.xml"
    structure_version: small-2018-v1-2-tys
    declared_multiplier: 1000
    actual_multiplier: 1
    evidence: >-
      Share capital 50,000,000 against 50,000 in FY2018-2020 and FY2023-2025; FY2020's figures
      and FY2022's prior-year column agree with this file only at x1000 / x1 respectively.
    reviewed_by: owner
    reviewed_on: 2026-10-21
