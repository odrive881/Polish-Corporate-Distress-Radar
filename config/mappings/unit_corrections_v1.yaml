# Unit corrections v1 (plan 0023, owner 2026-10-21; AGENT_SPEC §4.2, PROJECT_OVERVIEW stage 5).
# Loaded and checked by `distress_radar.parsing.canonical_schema.load_mapping_config`.
#
# The unit of a Ministry of Finance statement is fixed by its structure (`…WTysiacach` multiplies
# every amount by 1,000). A filer who types złoty into a thousands form makes every amount 1,000
# times too large, and every identity still holds. Each entry below is one statement file found
# so and reviewed by the owner: C maps it with `actual_multiplier` instead of the structure's,
# gives it a spec hash of its own (so a parse record and run id of its own), caps its grade at
# `warn`, and logs `unit_corrected` (stage C2) in `quarantine_events`. Its facts keep their source
# document hash and element paths. Nothing is guessed: a file is listed only with evidence.
#
# `check` is the automatic part, which never corrects: `parsing/unit_plausibility.py` flags a
# file whose balance sheet, reported twice, is about 1,000 off, graded `warn` and logged
# `unit_suspected` (E2), for the owner to review and, if confirmed, list here. Engineering
# thresholds, not statute.
#
# The file name is the version: a new correction is a new file, never an edit, and earlier
# versions stay as the record.

version: unit_corrections_v1

check:
  tolerance_log10: 0.5     # a factor between about 316 and 3,162
  min_share_scaled: 0.8    # of the lines both columns carry
  min_shared_lines: 5

corrections:
  # Evidence for all three (plan 0023, § "Findings"): the same balance sheet, reported again in
  # the next złoty filing's prior-year column, is 1,000 times smaller on 98-100% of its lines;
  # and the share capital, flat in every other year, is 1,000 times larger in exactly these.
