# Small form (UoR Annex 5, JednostkaMala), CRWDE template 13818, wariant 2,
# schema 1-0E. Applies to fiscal years beginning on or after 2025-01-01
# (ADR 0005). Plan 0017 step B. The statement sits inside a CRWDE `Dokument`
# envelope, as the full and micro wariant 2 do.
#
# Wariant 2's statement types equal schema 1-3's element for element, labels
# included (plan 0017 step A4), so this binds the bodies `small-2025-v1-3`
# binds, with the same alternatives (trap (a): the full form's statements,
# chosen per statement) and the same eight `.R2025` overrides, which cover the
# small body's three narrowed lines and the full body's six. Each alternative's
# items sit in wariant 2's own `…Struktury` namespaces, not the MF 2025 ones.
structure_version: small-2025-w2-v1-0
form: small
body: jednostka_mala
detect:
  root_namespace: "http://crd.gov.pl/wzor/2025/08/07/13818/"
  root_name: Dokument
  kod_systemowy: "SFJMAZ (2)"
  wersja_schemy: "1-0E"
xsd: "http://crd.gov.pl/wzor/2025/08/07/13818/schemat.xsd"
effective_from: 2025-01-01  # fiscal-year start, ADR 0005
effective_to: null
namespaces:
  tns: "http://crd.gov.pl/wzor/2025/08/07/13818/"
  jma: "http://crd.gov.pl/xml/schematy/dziedzinowe/mf/2025/07/31/eD/JednostkaMalaStruktury/"
  jin: "http://crd.gov.pl/xml/schematy/dziedzinowe/mf/2025/07/31/eD/JednostkaInnaStruktury/"
  dtsf: "http://crd.gov.pl/xml/schematy/dziedzinowe/mf/2025/07/31/eD/StrukturyDanychSprFin/"
statement_root: "/tns:Dokument/tns:TrescDokumentu/tns:JednostkaMala"
header:
  kod_sprawozdania: "tns:Naglowek/jma:KodSprawozdania"
  period_start: "tns:Naglowek/dtsf:OkresOd"
  period_end: "tns:Naglowek/dtsf:OkresDo"
unit:
  SprFinJednostkaMalaWZlotych: 1
statements:
  Bilans:
    - {xpath: "tns:BilansJednostkaMala", body: jednostka_mala, item_namespace: jma}
    - {xpath: "tns:BilansJednostkaInna", body: jednostka_inna, item_namespace: jin}
  RZiS:
    - {xpath: "tns:RZiSJednostkaMala", body: jednostka_mala, item_namespace: jma}
    - {xpath: "tns:RZiSJednostkaInna", body: jednostka_inna, item_namespace: jin}
item_namespace: jma
amount_namespace: dtsf
columns:
  KwotaA: current_year
  KwotaB: prior_year
  KwotaB1: prior_year_restated
code_overrides:
  IS.CALC.A: IS.CALC.A.R2025
  IS.CALC.A.USER: IS.CALC.A.R2025.USER
  IS.CALC.A.II: IS.CALC.A.II.R2025
  IS.CALC.B: IS.CALC.B.R2025
  IS.CALC.B.USER: IS.CALC.B.R2025.USER
  IS.CALC.B.II: IS.CALC.B.II.R2025
  IS.COMP.A.IV: IS.COMP.A.IV.R2025
  IS.COMP.B.VIII: IS.COMP.B.VIII.R2025
