# Shared body of the full-form (UoR Annex 1, `JednostkaInna`) statements, plan 0004.
#
# Every JednostkaInna schema version (v1-0, v1-2, v1-3, wariant 2) and its
# thousands twin declares these statutory elements identically, so the
# structure specs in `config/mappings/structures/` share this file and bind
# the namespaces. The `small-*` specs bind it too, as a statement alternative:
# a JednostkaMala envelope may carry these full-form statements instead of the
# small ones (plan 0005 step D), and the complexType is the same. `path` is the element's local-name path below the statement
# element (`Bilans`, `RZiS`, ...); `code` is its canonical chart code.
#
# - `section: true`: a header with no amounts of its own (not a fact).
# - `header: true`: a section heading that schema 1-0 gave amounts (cash-flow
#   A/B/C) although the UoR template has none there; schema 1-2 dropped them.
#   Kept as filed facts where present (most filers wrote 0.00, some the section
#   total), but never checked: they are not statutory lines.
# - `of_which: true`: a "w tym" breakdown line; excluded from its parent's sum.
# - `required: true`: a document without it is quarantined (`required_item_missing`).
# - A parent with amounts must equal the sum of its non-`of_which` children
#   that carry amounts (`subtotals_consistent`), except where `formulas` below
#   define it, and except the statements listed in `no_subtotal_check`.
# - `user_code`: where the element declares interleaved user-defined lines
#   (`PozycjaUszczegolawiajaca_N`), their amounts are summed per column into
#   one fact with this code. It counts towards the element's own subtotal,
#   unless `user_of_which: true` (the element is a "w tym" line, so extra
#   lines under it are breakdowns). Breakdowns of a single line
#   (`PozycjaUszczegolawiajaca` inside a leaf, `Podpozycja`) are not captured:
#   they only detail an amount that is already a fact.
# - `formulas`: computed lines, `code: [[sign, code], ...]`, checked the same way.
#
# Bootstrapped 2026-09-17 from JednostkaInnaStrukturyDanychSprFin_v1-2.xsd; the
# coverage test checks it still lists every statutory element of each mapped XSD.
body: jednostka_inna
no_subtotal_check: [ZestZmianWKapitale]  # opening + changes = closing, not a sum of children
formulas:
  IS.COMP.C: [[1, IS.COMP.A], [-1, IS.COMP.B]]
  IS.COMP.F: [[1, IS.COMP.C], [1, IS.COMP.D], [-1, IS.COMP.E]]
  IS.COMP.I: [[1, IS.COMP.F], [1, IS.COMP.G], [-1, IS.COMP.H]]
  IS.COMP.L: [[1, IS.COMP.I], [-1, IS.COMP.J], [-1, IS.COMP.K]]
  IS.CALC.C: [[1, IS.CALC.A], [-1, IS.CALC.B]]
  IS.CALC.F: [[1, IS.CALC.C], [-1, IS.CALC.D], [-1, IS.CALC.E]]
  IS.CALC.I: [[1, IS.CALC.F], [1, IS.CALC.G], [-1, IS.CALC.H]]
  IS.CALC.L: [[1, IS.CALC.I], [1, IS.CALC.J], [-1, IS.CALC.K]]
  IS.CALC.O: [[1, IS.CALC.L], [-1, IS.CALC.M], [-1, IS.CALC.N]]
  CF.IND.A.III: [[1, CF.IND.A.I], [1, CF.IND.A.II]]
  CF.IND.B.III: [[1, CF.IND.B.I], [-1, CF.IND.B.II]]
  CF.IND.C.III: [[1, CF.IND.C.I], [-1, CF.IND.C.II]]
  CF.IND.D: [[1, CF.IND.A.III], [1, CF.IND.B.III], [1, CF.IND.C.III]]
  CF.DIR.A.III: [[1, CF.DIR.A.I], [-1, CF.DIR.A.II]]
  CF.DIR.B.III: [[1, CF.DIR.B.I], [-1, CF.DIR.B.II]]
