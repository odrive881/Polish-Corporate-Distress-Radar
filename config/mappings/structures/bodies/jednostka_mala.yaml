# Small form (UoR Annex 5, `JednostkaMala`), schemas 1-0E, 1-2, 1-3 and CRWDE
# wariant 2. Plan 0005 step C; classification in the ADR 0005 second addendum.
#
# One body serves every version: the element tree is identical in all four.
# 1-3 and wariant 2 narrow three income-statement lines from goods *and
# materials* to goods only, which their specs handle with `code_overrides`
# onto the existing `.R2025` codes — the tree does not change, only meaning.
#
# What the small form does NOT declare: a cash-flow statement and an
# equity-changes statement. Small entities are exempt and the schemas have no
# such types, so no `cash_flow` or `equity_changes` facts are ever produced
# for a small filing. That is a schema fact, not a filer omission.
#
# **The section letters do not line up with the full form.** The small form has
# fewer sections, so its `F` is the full form's `G`, its `G` is the full form's
# `H`, and so on from the operating result onward. Every code below was matched
# by meaning, never by position; where the letters differ the full-form path is
# noted at the end of the line. Do not "tidy" these by making letters agree.
#
# Flags follow `jednostka_inna.yaml`: `section`, `of_which`, `user_code`,
# `user_of_which`, `required`.
body: jednostka_mala
formulas:
  # The small form skips the full form's operating-result line, so its profit
  # chain is its own. Letters in the labels are the SMALL form's.
  IS.COMP.C: [[1, IS.COMP.A], [-1, IS.COMP.B]]
  IS.COMP.MALA.H: [[1, IS.COMP.C], [1, IS.COMP.D], [-1, IS.COMP.E], [1, IS.COMP.G], [-1, IS.COMP.H]]
  IS.COMP.MALA.J: [[1, IS.COMP.MALA.H], [-1, IS.COMP.J]]
  IS.CALC.MALA.E: [[1, IS.CALC.A], [-1, IS.CALC.B], [-1, IS.CALC.D], [-1, IS.CALC.E]]
  IS.CALC.MALA.J: [[1, IS.CALC.MALA.E], [1, IS.CALC.G], [-1, IS.CALC.H], [1, IS.CALC.J], [-1, IS.CALC.K]]
  IS.CALC.MALA.L: [[1, IS.CALC.MALA.J], [-1, IS.CALC.M]]
