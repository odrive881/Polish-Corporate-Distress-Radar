# Micro form (UoR Annex 4, JednostkaMikro), CRWDE template 13821, wariant 2,
# schema 1-0E. Applies to fiscal years beginning on or after 2025-01-01
# (ADR 0005). Plan 0005 step D. The statement sits inside a CRWDE `Dokument`
# envelope, as the full-form wariant 2 does.
#
# Binds the v1_3 micro body: wariant 2 drops the `G` block exactly as schema
# 1-3 does (ADR 0005 second addendum §1).
#
# A micro envelope may carry the small or the full form's balance sheet and
# income statement instead of the micro ones, chosen per statement, as its XSD
# allows (trap (a), plan 0017 finding 1): the micro body first, then the small
# and the full body, each in wariant 2's own `…Struktury` namespace. The filing
# stays `micro`; the body read is in each fact's `source_element_path`. The
# small and full bodies' narrowed income-statement lines take the same eight
# `.R2025` overrides as `small-2025-v1-3` (plan 0017 step A4); the micro body
# has none of those codes.
structure_version: micro-2025-w2-v1-0
form: micro
body: jednostka_mikro_v1_3
detect:
  root_namespace: "http://crd.gov.pl/wzor/2025/08/12/13821/"
  root_name: Dokument
  kod_systemowy: "SFJMIZ (2)"
  wersja_schemy: "1-0E"
xsd: "http://crd.gov.pl/wzor/2025/08/12/13821/schemat.xsd"
effective_from: 2025-01-01  # fiscal-year start, ADR 0005
effective_to: null
namespaces:
  tns: "http://crd.gov.pl/wzor/2025/08/12/13821/"
  jmi: "http://crd.gov.pl/xml/schematy/dziedzinowe/mf/2025/07/31/eD/JednostkaMikroStruktury/"
  jma: "http://crd.gov.pl/xml/schematy/dziedzinowe/mf/2025/07/31/eD/JednostkaMalaStruktury/"
  jin: "http://crd.gov.pl/xml/schematy/dziedzinowe/mf/2025/07/31/eD/JednostkaInnaStruktury/"
  dtsf: "http://crd.gov.pl/xml/schematy/dziedzinowe/mf/2025/07/31/eD/StrukturyDanychSprFin/"
statement_root: "/tns:Dokument/tns:TrescDokumentu/tns:JednostkaMikro"
header:
  kod_sprawozdania: "tns:Naglowek/jmi:KodSprawozdania"
  period_start: "tns:Naglowek/dtsf:OkresOd"
  period_end: "tns:Naglowek/dtsf:OkresDo"
unit:
  SprFinJednostkaMikroWZlotych: 1
statements:
  Bilans:
    - {xpath: "tns:BilansJednostkaMikro", body: jednostka_mikro_v1_3, item_namespace: jmi}
    - {xpath: "tns:BilansJednostkaMala", body: jednostka_mala, item_namespace: jma}
    - {xpath: "tns:BilansJednostkaInna", body: jednostka_inna, item_namespace: jin}
  RZiS:
    - {xpath: "tns:RZiSJednostkaMikro", body: jednostka_mikro_v1_3, item_namespace: jmi}
    - {xpath: "tns:RZiSJednostkaMala", body: jednostka_mala, item_namespace: jma}
    - {xpath: "tns:RZiSJednostkaInna", body: jednostka_inna, item_namespace: jin}
item_namespace: jmi
amount_namespace: dtsf
columns:
  KwotaA: current_year
  KwotaB: prior_year
  KwotaB1: prior_year_restated
code_overrides:
  IS.CALC.A: IS.CALC.A.R2025
  IS.CALC.A.USER: IS.CALC.A.R2025.USER
  IS.CALC.A.II: IS.CALC.A.II.R2025
  IS.CALC.B: IS.CALC.B.R2025
  IS.CALC.B.USER: IS.CALC.B.R2025.USER
  IS.CALC.B.II: IS.CALC.B.II.R2025
  IS.COMP.A.IV: IS.COMP.A.IV.R2025
  IS.COMP.B.VIII: IS.COMP.B.VIII.R2025
