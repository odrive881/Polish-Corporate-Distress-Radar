# envelope, as the full-form wariant 2 does.
#
# Binds the v1_3 micro body: wariant 2 drops the `G` block exactly as schema
# 1-3 does (ADR 0005 second addendum §1). Micro filings always carry the micro
# statements, so no alternatives are needed.
