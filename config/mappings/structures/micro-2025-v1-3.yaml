# Micro form (UoR Annex 4, JednostkaMikro), schema 1-3. Plan 0005 step D.
# 1-3 drops the G block; that is why this binds the v1_3 body.
#
# A micro envelope may carry the small or the full form's balance sheet and
# income statement instead of the micro ones, chosen per statement, as its XSD
# allows (trap (a), plan 0017 finding 1): the micro body first, then the small
# and the full body, each in this version's own `…Struktury` namespace. The
# filing stays `micro`; the body read is in each fact's `source_element_path`.
# The small and full bodies' narrowed income-statement lines take the same eight
# `.R2025` overrides as `small-2025-v1-3` (plan 0017 step A4); the micro body
# has none of those codes.
structure_version: micro-2025-v1-3
form: micro
body: jednostka_mikro_v1_3
detect:
  root_namespace: "http://www.mf.gov.pl/schematy/SF/DefinicjeTypySprawozdaniaFinansowe/2025/01/01/JednostkaMikroWZlotych"
  root_name: JednostkaMikro
  kod_systemowy: "SFJMIZ (1)"
  wersja_schemy: "1-3"
xsd: "https://www.gov.pl/static/finanse/SF/DefinicjeTypySprawozdaniaFinansowe/2024/10/24/JednostkaMikroWZlotych(1)_v1-3.xsd"
effective_from: null
effective_to: null
namespaces:
  tns: "http://www.mf.gov.pl/schematy/SF/DefinicjeTypySprawozdaniaFinansowe/2025/01/01/JednostkaMikroWZlotych"
  jmi: "http://www.mf.gov.pl/schematy/SF/DefinicjeTypySprawozdaniaFinansowe/2025/01/01/JednostkaMikroStruktury"
  jma: "http://www.mf.gov.pl/schematy/SF/DefinicjeTypySprawozdaniaFinansowe/2025/01/01/JednostkaMalaStruktury"
  jin: "http://www.mf.gov.pl/schematy/SF/DefinicjeTypySprawozdaniaFinansowe/2025/01/01/JednostkaInnaStruktury"
  dtsf: "http://www.mf.gov.pl/schematy/SF/DefinicjeTypySprawozdaniaFinansowe/2018/07/09/DefinicjeTypySprawozdaniaFinansowe/"
statement_root: "/tns:JednostkaMikro"
header:
  kod_sprawozdania: "tns:Naglowek/jmi:KodSprawozdania"
  period_start: "tns:Naglowek/dtsf:OkresOd"
  period_end: "tns:Naglowek/dtsf:OkresDo"
unit:
  SprFinJednostkaMikroWZlotych: 1
statements:
  Bilans:
    - {xpath: "tns:BilansJednostkaMikro", body: jednostka_mikro_v1_3, item_namespace: jmi}
    - {xpath: "tns:BilansJednostkaMala", body: jednostka_mala, item_namespace: jma}
    - {xpath: "tns:BilansJednostkaInna", body: jednostka_inna, item_namespace: jin}
  RZiS:
    - {xpath: "tns:RZiSJednostkaMikro", body: jednostka_mikro_v1_3, item_namespace: jmi}
    - {xpath: "tns:RZiSJednostkaMala", body: jednostka_mala, item_namespace: jma}
    - {xpath: "tns:RZiSJednostkaInna", body: jednostka_inna, item_namespace: jin}
item_namespace: jmi
amount_namespace: dtsf
columns:
  KwotaA: current_year
  KwotaB: prior_year
  KwotaB1: prior_year_restated
code_overrides:
  IS.CALC.A: IS.CALC.A.R2025
  IS.CALC.A.USER: IS.CALC.A.R2025.USER
  IS.CALC.A.II: IS.CALC.A.II.R2025
  IS.CALC.B: IS.CALC.B.R2025
  IS.CALC.B.USER: IS.CALC.B.R2025.USER
  IS.CALC.B.II: IS.CALC.B.II.R2025
  IS.COMP.A.IV: IS.COMP.A.IV.R2025
  IS.COMP.B.VIII: IS.COMP.B.VIII.R2025
