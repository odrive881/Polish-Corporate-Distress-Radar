# Structure versions C1 recognises but does not map yet (plan 0004, decision 7).
#
# A document matching one of these is recorded as `not_yet_mapped` and skipped;
# it is not quarantined, because nothing is wrong with it. A document matching
# neither this list nor a spec in this directory is quarantined as
# `unknown_structure_version`. Every entry's XSD is vendored in `config/xsd/`;
# system codes and schema versions were read from those XSDs (fixed values).
# Move an entry out of here when its spec is written (Phase 3).
versions:
  # Thousands-of-złoty twins no in-scope filing uses (plan 0017 decision 1): the
  # six that list v1's filers use were mapped in plan 0017 step D.
  - root_namespace: "http://www.mf.gov.pl/schematy/SF/DefinicjeTypySprawozdaniaFinansowe/2018/07/09/JednostkaMalaWTysiacach"
    root_name: JednostkaMalaWTys
    kod_systemowy: "SFJMAT (1)"
    wersja_schemy: "1-0E"
    xsd: "https://www.mf.gov.pl/documents/764034/6464789/JednostkaMalaWTysiacach(1)_v1-0.xsd"
  - root_namespace: "http://www.mf.gov.pl/schematy/SF/DefinicjeTypySprawozdaniaFinansowe/2025/01/01/JednostkaMalaWTysiacach"
    root_name: JednostkaMalaWTys
    kod_systemowy: "SFJMAT (1)"
    wersja_schemy: "1-3"
    xsd: "https://www.gov.pl/static/finanse/SF/DefinicjeTypySprawozdaniaFinansowe/2024/10/24/JednostkaMalaWTysiacach(1)_v1-3.xsd"
  - root_namespace: "http://www.mf.gov.pl/schematy/SF/DefinicjeTypySprawozdaniaFinansowe/2025/01/01/JednostkaMikroWTysiacach"
    root_name: JednostkaMikroWTys
    kod_systemowy: "SFJMIT (1)"
    wersja_schemy: "1-3"
    xsd: "https://www.gov.pl/static/finanse/SF/DefinicjeTypySprawozdaniaFinansowe/2024/10/24/JednostkaMikroWTysiacach(1)_v1-3.xsd"
  # CRWDE wariant 2. Plan 0005 step B probed 13817–13821: 13817 is the full form
  # (mapped), 13818 the small (mapped, plan 0017 step B), 13819 the micro
  # thousands twin, 13821 the micro (mapped) (13820 is JednostkaOp, public-benefit
  # organisations, outside the v1 sp. z o.o. scope). Plan 0017 step A found the
  # other two in list v1's downloads: 13810, the full thousands twin (mapped, plan
  # 0017 step D), and 13846, the small thousands twin, whose one filer is out of
  # the segment. With them, all
  # six headers the 2025/07/31 domain schemas declare (SFJ{IN,MA,MI}{Z,T} (2))
  # have a template. Every CRWDE file's root is the `Dokument` envelope, not the
  # statement element inside `TrescDokumentu` (plan 0017 step A corrected 13818
  # and 13819, which were catalogued with the inner name and so never matched).
  - root_namespace: "http://crd.gov.pl/wzor/2025/08/11/13819/"
    root_name: Dokument
    kod_systemowy: "SFJMIT (2)"
    wersja_schemy: "1-0E"
    xsd: "http://crd.gov.pl/wzor/2025/08/11/13819/schemat.xsd"
  - root_namespace: "http://crd.gov.pl/wzor/2025/09/10/13846/"
    root_name: Dokument
    kod_systemowy: "SFJMAT (2)"
    wersja_schemy: "1-0E"
    xsd: "http://crd.gov.pl/wzor/2025/09/10/13846/schemat.xsd"
