# Structure versions C1 recognises but does not map yet (plan 0004, decision 7).
#
# A document matching one of these is recorded as `not_yet_mapped` and skipped;
# it is not quarantined, because nothing is wrong with it. A document matching
# neither this list nor a spec in this directory is quarantined as
# `unknown_structure_version`. Every entry's XSD is vendored in `config/xsd/`;
# system codes and schema versions were read from those XSDs (fixed values).
# Move an entry out of here when its spec is written (Phase 3).
