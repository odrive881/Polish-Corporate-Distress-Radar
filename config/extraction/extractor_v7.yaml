# Extractor v7 (plan 0013, 2026-10-22; v1 from step F, decisions 2 and 3): which model or rule reads
# each signal_type, and how the model is called. Engineering config, not statute.
# Loaded and checked by `distress_radar.extraction.extractor.load_extractor`.
#
# The file name is the `extractor_version`. Change the model, the effort or a prompt, and it is a new
# file: every response is stored under a hash of its full request, so a new setting is a new key and
# a new call, never an overwrite of what an earlier setting answered.
#
# Model: the current Opus (decision 2 named `claude-opus-5`, "the SDK's current default"; the default
# Opus is now `claude-opus-5-5`, at a lower price). A cheaper model is compared on the golden set in
# a new file before it replaces this one. Thinking is always on for this model and is left to it;
# `effort` is set explicitly, since this model's default (`medium`) differs from its predecessor's.
# No refusal fallback to another model: an answer from a model the key does not name would break the
# response store and decision 2's comparison rule. A refusal is discarded and counted.
#
# `prefilter_version` is the prefilter in front of the extractor: a page is read for a signal only
# when it selects the page for it, so it is part of what the eval scores (step G).
#
# Every signal_type is listed: `llm` names its prompt in `prompts/extraction/`, `rule` is read by
# `rules_version`. Only pages the prefilter selects for a signal are read for it.
#
# Changed from v6: `prefilter_v4` (`continued_existence_vote` also selects a resolution to continue the
# business, "uchwała … dalszej działalności"; owner, 2026-10-22). Every other signal's selection and
# every model request is v6's.
# v6 changed from v5: `prefilter_v3` (`opinion_type` also selects a page with the opinion sentence's own
# words, "zdaniem … sprawozdanie": v2 needed the word "opinia"). Every other signal's selection and
# every model request is v5's.
# v5 changed from v4: `rules_v4` (`opinion_type` by the sentence that states the opinion, not by headings;
# `audit_firm` unchanged). Every model signal's request is v4's, so its stored response is reused.
# v4 changed from v3: `post_balance_sheet_event_v2` (decision 9), `valued` (the answer gives the kind of
# event: adverse, favourable or neutral) and `balance_sheet_date` (the request carries the statement's
# balance-sheet date, so text carried forward from an earlier year is not read as this year's event).
# Every other signal's request is v3's, so its stored response is reused.
# v3 changed from v2: `rules_v3` (v2's rules plus the audit firm's number, for auditor change).
# v2 changed from v1: `rules_v2` (the auditor's opinion by its report's headings) and `prefilter_v2`
# (which selects those pages). Model, effort and prompts are v1's, so a model signal's request, and
# its stored response, are the same.

extractor_version: extractor_v7
model: claude-opus-5-5
effort: medium
max_tokens: 16000
rules_version: rules_v4
prefilter_version: prefilter_v4

signals:
  going_concern_uncertainty: {method: llm, prompt: going_concern_uncertainty_v1}
  opinion_type: {method: rule}
  emphasis_of_matter: {method: llm, prompt: emphasis_of_matter_v1}
  covenant_breach: {method: llm, prompt: covenant_breach_v1}
  key_customer_loss: {method: llm, prompt: key_customer_loss_v1}
  litigation: {method: llm, prompt: litigation_v1}
  post_balance_sheet_event:
    {method: llm, prompt: post_balance_sheet_event_v2, valued: true, balance_sheet_date: true}
  loss_coverage_resolution: {method: llm, prompt: loss_coverage_resolution_v1}
  continued_existence_vote: {method: llm, prompt: continued_existence_vote_v1}
