# Evidence spans the owner reviewed after the blocking `evidence_masked` check failed on them, and
# cleared: what the masker flags in each is not a person (invariant 6; ADR 0009, third addendum).
# Read by `extraction.text_signals.load_masking_exceptions` (the highest-numbered version), used by
# the check only. The masker itself is unchanged, so no page is masked differently and no model
# request is re-keyed.
#
# Each entry clears the named spans in one evidence text only: `evidence` is `evidence_key` (a hash
# of the whole evidence span), `spans` the `span_key`s (kind and a hash) of what the masker flags in
# it. Neither holds the text. The same words in any other evidence are still flagged, and only a
# `person` can be cleared: a PESEL, an e-mail or a phone number never is.
#
# Never edit a version: a change is a new file, masking_exceptions_v<n+1>.yaml.
