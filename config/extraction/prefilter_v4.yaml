# Prefilter v4 (plan 0013, 2026-10-21; v1 from step D, AGENT_SPEC §6 G1): which masked pages are
# candidates for each `signal_type`, by lemma, before any extractor sees them. Engineering config, not statute.
# Loaded and checked by `distress_radar.extraction.preprocessing.load_prefilter`.
#
# The file name is the `prefilter_version`. Change a term, and it is a new file with a new version,
# never an edit: the prefilter decides which pages reach an extractor, so it is part of what an
# extraction result depends on.
#
# A term matches a sentence when every one of its words is in that sentence, in any order. A word is
# one or more alternatives separated by `|`:
# - `kontynuacja` matches a token whose lemma is `kontynuacja`;
# - `zwróceni*` matches a token whose lemma or lowercased surface form starts with `zwróceni`.
# The text is lowercased before it is lemmatised: `pl_core_news_lg` leaves a sentence's capitalised
# first word unlemmatised. Stems are for the words its lemmatiser gets wrong, found by the examples:
# some verbal nouns come out as the verb (`naruszenia` → `naruszyć`, `zakończeniu` → `zakończyć`), some as
# no word at all (`zwrócenie` → `zwrócć`, `dalszego` → `dalszego`).
#
# Every term carries an invented example in an inflected form, and the tests check that the pinned
# model matches it: a term the model cannot match fails the build, not the recall.
#
# A prefilter is for recall: a page it rejects is never extracted. Terms are broad on purpose (the
# going-concern term also selects the accounting-policy boilerplate on the going-concern basis), and
# its recall is measured on a fixed sample of rejected pages (plan 0013 decision 5).
#
# Sources: the embedded notes are the only text in hand. `opinion_type` and `emphasis_of_matter` read
# auditor reports, `loss_coverage_resolution` and `continued_existence_vote` resolutions; notes can
# mention them too, and their terms are here so a captured document is filtered by the same rules.
#
# Changed from v3: `continued_existence_vote` only (plan 0013, "Open for the owner", item 4). Its one
# golden positive (`2c4d7e30c1579a17`, "Spółka podjęła uchwałę o prowadzeniu dalszej działalności") has no
# `istnienie` and no art. 233, so v3 rejected its page and the signal's end-to-end recall was 0. Two terms
# are added: a resolution about further activity, and one about continuing it, each needing `uchwała` in
# the same sentence, since "dalszej działalności" and "kontynuacji działalności" alone are the
# going-concern basis's boilerplate. Every other signal's terms are v3's, unchanged, so no other model
# request changes.
# v3 changed from v2: `opinion_type` only. `rules_v4` reads the sentence that states the opinion, and a
# sole practitioner's ("Moim zdaniem, sprawozdanie finansowe :") stood on a page with no word whose lemma
# is `opinia`, so v2 never let the rule see it (the `text` job, 2026-10-13: one seed report lost its
# opinion). A sentence with `zdanie` and `sprawozdanie` is now a candidate too. Notes say "Zdaniem
# Zarządu, sprawozdanie…" as well; the rule needs "naszym" or "moim", and costs nothing. Every other
# signal's terms are v2's, unchanged, so no model request changes.
# v2 changed from v1: `opinion_type` only. `rules_v2` reads the opinion from a report's headings,
# unqualified included ("Opinia", "Podstawa opinii"), and v1's terms selected only the wording of
# a modified opinion, so a report headed "Opinia" never reached the rule. Every page with a word
# whose lemma is `opinia` is now a candidate; the rule costs nothing, and decides by heading.
# Every other signal's terms are v1's, unchanged.

prefilter_version: prefilter_v4

signals:
  going_concern_uncertainty:
    - words: [kontynuacja|kontynuować|kontynuowanie, działalność]
      example: Istnieją okoliczności wskazujące na zagrożenie kontynuacji działalności.
    - words: [zagrożenie|zagrażać|zagrozić, działalność]
      example: Sytuacja finansowa zagraża dalszej działalności Spółki.
    - words: [upadłość|upadłościowy]
      example: Zarząd złożył wniosek o ogłoszenie upadłości.
    - words: [restrukturyzacja|restrukturyzacyjny|sanacja|sanacyjny]
      example: Spółka złożyła wniosek o otwarcie postępowania sanacyjnego.
    - words: [układ, wierzyciel]  # `układ` alone is also the income statement's layout
      example: Sąd zatwierdził układ z wierzycielami.
    - words: [likwidacja, spółka]
      example: Wspólnicy podjęli uchwałę o otwarciu likwidacji Spółki.
    - words: [utrata|utracić, płynność]
      example: Spółka utraciła płynność finansową.
    - words: [niewypłacalność|niewypłacalny]
      example: Spółka stała się niewypłacalna.

  opinion_type:
    - words: [opinia]
      example: Opinia. Podstawa opinii z zastrzeżeniem. Odmowa wyrażenia opinii.
    - words: [zdanie|zdani*, sprawozdanie|sprawozdani*]
      example: Moim zdaniem, zbadane sprawozdanie finansowe przedstawia rzetelny obraz.

  emphasis_of_matter:
    - words: [zwróceni*|zwracać|zwrócić, uwaga]
      example: Zwrócenie uwagi. Zwracamy uwagę na notę 5.

  covenant_breach:
    - words: [kowenant|kowenantowy]
      example: Doszło do naruszenia kowenantów.
    - words: [naruszeni*|naruszyć|dotrzymać|niedotrzymani*, warun*]  # `warunki` is its own lemma
      example: Spółka naruszyła warunki umowy kredytowej. Spółka nie dotrzymała warunku umowy.
    - words: [wypowiedzenie|wypowiedzieć, kredyt|kredytowy|pożyczka]
      example: Bank wypowiedział umowę kredytową.
    - words: [natychmiastowy, wymagalność]
      example: Bank postawił kredyt w stan natychmiastowej wymagalności.

  key_customer_loss:
    - words: [utrata|utracić, klient|odbiorca|kontrahent|zamawiający|kontrakt|zlecenie]
      example: Spółka utraciła głównego odbiorcę.
    - words: [odstąpić|odstąpieni*, umowa|kontrakt]
      example: Odstąpienie od umowy przez inwestora. Inwestor odstąpił od kontraktu.
    - words: [rozwiązanie|rozwiązać, umowa|kontrakt, inwestor|zamawiający|klient|odbiorca]
      example: Zamawiający rozwiązał umowę o roboty budowlane.
    - words: [główny|kluczowy, odbiorca|klient]
      example: Kluczowym klientem Spółki jest jeden inwestor.

  litigation:
    - words: [pozew|powództwo]
      example: Wniesiono pozew o zapłatę.
    - words: [postępowanie|sprawa|spór, sądowy]
      example: Przeciwko Spółce toczy się postępowanie sądowe.
    - words: [nakaz, zapłata]
      example: Sąd wydał nakaz zapłaty.
    - words: [egzekucja|egzekucyjny|komornik|komorniczy]
      example: Komornik prowadzi egzekucję z rachunku Spółki.
    - words: [roszczenie]
      example: Podwykonawca zgłosił roszczenia wobec Spółki.
    - words: [arbitraż|arbitrażowy]
      example: Spór rozstrzygnie sąd arbitrażowy.

  post_balance_sheet_event:
    - words: [po, dzień, bilansowy]
      example: Zdarzenia po dniu bilansowym.
    - words: [po, data, bilans]
      example: Po dacie bilansu nie wystąpiły istotne zdarzenia.
    - words: [po, zakończyć|zakończeni*, rok]
      example: Zdarzenia, które nastąpiły po zakończeniu roku obrotowego.

  loss_coverage_resolution:
    - words: [pokryci*|pokryć, strata]
      example: Propozycja pokrycia straty. Stratę proponuje się pokryć z zysków lat przyszłych.

  continued_existence_vote:
    - words: [dalsz*, istnienie|istnieć]
      example: Uchwała w sprawie dalszego istnienia Spółki.
    - words: ["233", ksh|kodeks|k.s.h.]
      example: Strata przekroczyła połowę kapitału zakładowego (art. 233 KSH).
    - words: [uchwała, dalsz*, działalność]
      example: Wspólnicy podjęli uchwałę o prowadzeniu dalszej działalności Spółki.
    - words: [uchwała, kontynuowani*|kontynuacja|kontynuować, działalność]
      example: Zgromadzenie podjęło uchwałę o kontynuowaniu działalności.
