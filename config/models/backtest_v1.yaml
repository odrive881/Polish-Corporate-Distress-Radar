# The out-of-time backtest (plan 0012 owner decisions 1, 2, 5). Engineering choices, not statute.
# Loaded by `distress_radar.models.splits.load_backtest_config`. The file name is the version:
# change a value after seeing results, and it is a new file (owner decision 5), never an edit.

backtest: backtest_v1
# The inputs, pinned: one feature set and one frozen label set (plan 0009), by hash.
feature_set_version: feature_set_v3
label_set_hash: 066d18bbd4cde37fdd9d239ce687fd601f7075570b1a1593540cd009f75389a1
horizons: [12, 24]
# Decision 1: distress against `alive`; censored rows are left out of the binary models.
distress_classes: [bankruptcy, restructuring, liquidation, silent_exit]
# Decision 2: expanding window by calendar year. A test year trains on rows whose whole label
# window closed before its 1 January. 2020-21 COVID, 2022 rate rises, 2022-23 energy shock.
test_years: [2020, 2021, 2022, 2023, 2024, 2025]
# Decision 2's minimum-events rule: a fold with fewer distinct training or test events than this
# is reported as not evaluable, and its metrics print as n/a (decision 8).
min_events: 3

# Decision 5, approved by the owner on 2026-09-27 and committed before the first backtest run.
# Complete cases on a small fixed set of ratios, one per dimension (solvency, liquidity,
# profitability, activity), chosen for coverage: none of them loses a seed event. Each ratio is
# rank-transformed within the training fold to [0, 1], ties averaged, so extreme ratios cannot
# dominate and the penalty acts on one scale. Not tuned: tuning on six events fits noise.
logistic_regression:
  features: [equity_to_assets, working_capital_to_assets, roa, asset_turnover]
  penalty: l2
  C: 1.0
  class_weight: none  # weighting would distort the probabilities the Brier score judges

# Decision 8: bootstrap intervals resampled by entity (rows of one company move together), a
# percentile interval over `replicates` resamples drawn from a fixed seed, so the report is
# reproducible byte for byte. Wide on the seed, and shown.
bootstrap:
  replicates: 1000
  seed: 20260927
  level: 0.95
# Decision 8: the reliability table's probability bins, [0, 0.1), [0.1, 0.2), ... [0.9, 1.0].
reliability_bins: 10
