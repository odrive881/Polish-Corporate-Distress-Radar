# Draw spec for list v3 of construction_sme_v1 (plan 0019 decisions 0 and 10; ADR 0014,
# § "List v3's random group"). Declarative data, not code: how each group was drawn, so that every
# drawn company's probability of being drawn, π, is exact.
#
# Design: systematic. The owner's scripts drew both groups against Rejestr.io's search and logged
# every pick; the logs stay outside the repository (they hold company names), and only their
# SHA-256 is here. `universe_draw` checks each log against this spec, pick by pick, before
# anything is stored:
#   random        E:\Rejestr.io company pull\most_recent_run\rejestr_log_2026-10-19_1403.txt
#   w_upadlosci,  E:\Rejestr.io company pull\most_recent_distressed_run\
#   w_likwidacji    rejestr_distressed_log_2026-10-19_1721.txt (one log, one run per status)
#
# π = 600/59,547 for a company of F; a company carrying distress statuses C (in any log) has
# π = 1 − (1 − 600/59,547) · Π_(c in C) (1 − n_Bc/N_Dc).
design: systematic
segment: construction_sme_v1
version: 1

frame:
  source: rejestr_io
  taken_on: 2026-10-19
  # As the logs' raw filter JSON prints them, unset ones left out. `ind: F` reads the predominant
  # PKD, with pre-2004 codes mapped to it (owner, 2026-10-20); the PKD version is not stated.
  filters:
    lf: szoo
    ind: F
    rd: "2001-01-01:2022-12-31"
  # N_F at 14:03 (group A's run). The distress run, at 17:21, counted 59,549 with the same filters:
  # the drift is recorded on its runs as `frame_size`.
  size: 59547

distress_statuses:
  w_upadlosci:
    label: W upadłości
    filter_value: bpcy
  w_likwidacji:
    label: W likwidacji
    filter_value: liq

random:
