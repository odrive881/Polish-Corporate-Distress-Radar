# Feature set v5 (plan 0013 decision 7, with decision 0c): v4's features, unchanged, plus the
# auditor reports: the opinion and the auditor change (`auditor_reports`, the `audit` family) and
# the auditor's emphasis of matter (`text_coverage`, the text family on `auditor_report` documents).
#
# v4 (plan 0013 decision 7) was v3's features, unchanged, plus two families read from the
# statements themselves: the introduction's disclosures (`statement_disclosures`) and the signals in
# the embedded notes (`text_signals`, through `text_coverage`).
#
# v3 (plan 0012 step B) was: v2's features, unchanged, over `line_items_v3`, which counts the
# narrowed 2025 calculation-variant revenue line (`IS.CALC.A.R2025`) as revenue.
#
# v2 (plan 0012 owner decision 3) was v1, unchanged, plus the ratios the classical
# baselines in `config/models/` read. They are features, not model code, so the leakage test and
# the `feature_store` contract cover them. v1 (plan 0010 decisions 4 and 5) documents the kinds.
# Engineering choices, not statute.
# Loaded and cross-checked by `distress_radar.features.config.load_feature_set`.
#
# The file name is the `feature_set_version`, and a hash over this file and every config it reads
# (the line-item map, the KSH tripwires, the filing deadlines, the procedure taxonomy) is recorded
# with every build. Change a value, and it is a new file with a new version, never an edit.
#
# Every feature `f` is written with `f__known_from`: the latest `known_from` of the facts behind it
# (plan 0010 decision 2). A feature with no inputs is null, never imputed (invariant 4).
#
# Kinds, and the families that may use them:
# - `ratio` (financial, construction): Σ numerator / Σ denominator over ratio inputs of the latest
#   statement period known at `as_of_date` (the panel's version, plan 0010 step C), times
#   `scale`. `denominator: positive` also nulls a negative denominator, where the sign would
#   invert the meaning (ROE on negative equity).
# - `growth` (financial): x_t / x_{t−years} − 1, null unless the base is positive.
# - `volatility` (financial): sample standard deviation of a ratio feature over the latest `years`
#   periods, null unless every one of them has it.
#   Periods are not all a year long (plan 0010 step C); see `period_length_days` below.
# - `tripwire` (tripwire): a rule of `config/statutory/ksh_tripwires.yaml`.
# - `below_zero` (tripwire): an input is negative.
# - `filing` (filing): a filing-behaviour metric, computed from `filing_index`, the canonical grades
#   and `restatement_events`, over the fiscal years whose deadline had passed by `as_of_date`
#   (`config/statutory/filing_deadlines.yaml`). `lookback_years` limits it to the latest ones.
# - `event_count` (registry, legal_history): distinct events (`dedup_group_id`) in `legal_events`
#   whose `known_from` falls in the `window_months` before `as_of_date`, or ever when null. Never
#   by `event_date`: that is the leakage bug the blocking test exists for (AGENT_SPEC §9.1).
# - `disclosure_flag` / `disclosure_number` (disclosure): an item of the latest statement's
#   introduction (`config/mappings/statement_introduction.yaml`), as filed; `negate` turns a flag
#   so that true reads as the warning. Null when that statement does not report the item.
# - `text_flag` (text): whether the latest statement's notes carry `signal_type`; null unless they
#   were read for it (`text_coverage` `read`, or a kept `present` on a `partial` read).
# - `text_years` (text): the statement periods, among those known, whose latest filing's notes
#   carry `signal_type`; null until the notes of one of them were read for it.
#   Both are dated by the filing; a filing stops speaking on the day it is deleted.
#   `document_kind: auditor_report` reads the auditor reports instead of the notes (v5).
# - `audit_flag` (audit): a fact of the latest auditor report known, by period then filing
#   (`auditor_reports`): `modified_opinion` (qualified, adverse or disclaimer) or `auditor_changed`
#   (its audit firm differs from the entity's latest earlier report known at its filing). Null when
#   that report does not establish it: no opinion stated, no single firm, no earlier report.
# - `audit_years` (audit): the report periods, among those whose latest report establishes the
#   fact, that show it; null until one does.
#   Dated by the report's own filing; a report stops speaking on the day it is deleted.

feature_set_version: feature_set_v5
line_items: line_items_v3
legal_form: sp_z_oo

# Plan 0010 owner decision 3, as a switch. Quarantined statements (a material identity failure)
# are left out of the financial panel; their filings still count for filing behaviour. An
# experimental run that includes them is its own file (e.g. feature_set_v1q.yaml), so it gets its
# own version and hash. When true, a quarantined statement is usable: it wins its period over a
# later filing's prior-year column, and the panel records its grade.
include_quarantined_statements: false

# Plan 0010 owner decision 7 (2026-09-24): a feature that depends on a period's length is null when
# a period it reads is not about a year long, never annualised. Length-dependent: a ratio of a flow
# to a stock (ROA, ROE, asset turnover, the days ratios) and the growth of a flow (revenue growth);
# which inputs are flows is the line-item map's `flows`. A ratio of two flows (the margins) and
# anything built on stocks (liquidity, leverage, the tripwires, equity growth) is unaffected. A
# period known only from a later filing's prior-year column has no known start, so no known length,
# and its length-dependent features are null too. Bounds inclusive, in days.
period_length_days: {min: 335, max: 396}

# Growth and volatility compare periods by time, not by count: "1 year back" is the period that
# ended 12 months before the latest, within this many days, or null. A split year is two periods,
# so counting periods would compare with six months back.
lag_tolerance_days: 31

features:
  # --- financial ratios -----------------------------------------------------------------------
  - {name: current_ratio, family: financial, kind: ratio,
     numerator: {current_assets: 1}, denominator: {short_term_liabilities: 1}}
  - {name: quick_ratio, family: financial, kind: ratio,
     numerator: {current_assets: 1, inventories: -1}, denominator: {short_term_liabilities: 1}}
  - {name: debt_to_assets, family: financial, kind: ratio,
     numerator: {liabilities_and_provisions: 1}, denominator: {total_assets: 1}}
  - {name: equity_to_assets, family: financial, kind: ratio,
     numerator: {equity: 1}, denominator: {total_assets: 1}}
  - {name: roa, family: financial, kind: ratio,
     numerator: {net_result: 1}, denominator: {total_assets: 1}}
  - {name: roe, family: financial, kind: ratio,
     numerator: {net_result: 1}, denominator: {equity: 1}, denominator_rule: positive}
  - {name: net_margin, family: financial, kind: ratio,
     numerator: {net_result: 1}, denominator: {revenue: 1}, denominator_rule: positive}
  - {name: operating_margin, family: financial, kind: ratio,
     numerator: {operating_result: 1}, denominator: {revenue: 1}, denominator_rule: positive}
  - {name: asset_turnover, family: financial, kind: ratio,
     numerator: {revenue: 1}, denominator: {total_assets: 1}}
  - {name: working_capital_to_assets, family: financial, kind: ratio,
     numerator: {current_assets: 1, short_term_liabilities: -1}, denominator: {total_assets: 1}}
  # Not "interest coverage": the statements do not separate interest from other financial costs.
  - {name: operating_result_to_financial_costs, family: financial, kind: ratio,
     numerator: {operating_result: 1}, denominator: {financial_costs: 1},
     denominator_rule: positive}
  - {name: revenue_growth_1y, family: financial, kind: growth, input: revenue, years: 1}
  - {name: revenue_growth_2y, family: financial, kind: growth, input: revenue, years: 2}
  - {name: revenue_growth_3y, family: financial, kind: growth, input: revenue, years: 3}
  - {name: equity_growth_1y, family: financial, kind: growth, input: equity, years: 1}
  - {name: equity_growth_2y, family: financial, kind: growth, input: equity, years: 2}
  - {name: equity_growth_3y, family: financial, kind: growth, input: equity, years: 3}
  - {name: net_margin_volatility_3y, family: financial, kind: volatility, of: net_margin, years: 3}

  # --- construction ---------------------------------------------------------------------------
  # Revenue-based: the forms do not all carry cost of sales. No backlog proxy: nothing carries one.
  - {name: receivable_days, family: construction, kind: ratio, scale: 365,
     numerator: {short_term_receivables: 1}, denominator: {revenue: 1},
     denominator_rule: positive}
  - {name: short_term_liability_days, family: construction, kind: ratio, scale: 365,
     numerator: {short_term_liabilities: 1}, denominator: {revenue: 1},
     denominator_rule: positive}
  - {name: prepayments_to_assets, family: construction, kind: ratio,
     numerator: {short_term_prepayments: 1}, denominator: {total_assets: 1}}

  # --- legal tripwires (AGENT_SPEC §4.5) -------------------------------------------------------
  - {name: art233_triggered, family: tripwire, kind: tripwire, rule: art_233}
  - {name: negative_equity, family: tripwire, kind: below_zero, input: equity}

  # --- filing behaviour -----------------------------------------------------------------------
  # Days from the latest known statement's balance-sheet date to its filing.
  - {name: days_to_file_latest, family: filing, kind: filing, metric: days_to_file_latest}
  # Fiscal years whose deadline had passed with no statement known, within the lookback.
  - {name: missing_years_3y, family: filing, kind: filing, metric: missing_years, lookback_years: 3}
  # Statements filed after their deadline, within the lookback.
  - {name: late_filings_3y, family: filing, kind: filing, metric: late_filings, lookback_years: 3}
  - {name: corrections, family: filing, kind: filing, metric: corrections}
  # The latest statement was filed as a PDF, not structured XML (`needs_pdf_tier`).
  - {name: latest_filed_as_pdf, family: filing, kind: filing, metric: latest_filed_as_pdf}
  - {name: statements_quarantined, family: filing, kind: filing, metric: statements_quarantined}
  # Filings that restated an earlier year's figures.
  - {name: restating_filings, family: filing, kind: filing, metric: restating_filings}
  # The largest single-line restatement in the latest restating filing, over that year's total
  # assets. The largest line, not the sum: lines nest, so a sum counts one change several times.
  - {name: restatement_max_to_assets, family: filing, kind: filing,
     metric: restatement_max_to_assets}

  # --- registry dynamics ----------------------------------------------------------------------
  - {name: board_changes_12m, family: registry, kind: event_count,
     event_types: [board_changed], window_months: 12}
  - {name: board_changes_36m, family: registry, kind: event_count,
     event_types: [board_changed], window_months: 36}
  - {name: office_moves_12m, family: registry, kind: event_count,
     event_types: [office_moved], window_months: 12}
  - {name: office_moves_36m, family: registry, kind: event_count,
     event_types: [office_moved], window_months: 36}
  - {name: capital_changes_12m, family: registry, kind: event_count,
     event_types: [capital_changed], window_months: 12}
  - {name: capital_changes_36m, family: registry, kind: event_count,
     event_types: [capital_changed], window_months: 36}
  - {name: arrears_enforcements_12m, family: registry, kind: event_count,
     event_types: [arrears_enforcement_started], window_months: 12}
  - {name: curators_ever, family: registry, kind: event_count,
     event_types: [curator_appointed], window_months: null}

  # --- legal history --------------------------------------------------------------------------
  # An entity still in a proceeding is excluded by the labels, so these describe closed episodes.
  - {name: bankruptcy_petitions_ever, family: legal_history, kind: event_count,
     stage: petition, outcome_class: bankruptcy, window_months: null}
  - {name: restructuring_petitions_ever, family: legal_history, kind: event_count,
     stage: petition, outcome_class: restructuring, window_months: null}
  - {name: bankruptcies_closed_ever, family: legal_history, kind: event_count,
     stage: closing, ends: bankruptcy, window_months: null}
  - {name: restructurings_closed_ever, family: legal_history, kind: event_count,
     stage: closing, ends: restructuring, window_months: null}
  - {name: liquidations_closed_ever, family: legal_history, kind: event_count,
     stage: closing, ends: liquidation, window_months: null}

  # --- classical-model inputs (plan 0012 step B) ----------------------------------------------
  # Each maps a published ratio onto the Polish statements; the mapping is a choice, stated here.
  # Altman Z'' X1 is `working_capital_to_assets`; Poznań W7 is `roa`, W16 is `quick_ratio`.
  # Altman X2, retained earnings / total assets. Polish statements have no "retained earnings"
  # line: the undistributed results are prior years' result (A.V) plus the year's (A.VI). Capital
  # built from profit and moved to supplementary or reserve capital is not counted, since those
  # lines also hold share premium and revaluation. Null for micro, which has no equity breakdown.
  - {name: retained_earnings_to_assets, family: financial, kind: ratio,
     numerator: {retained_result: 1, net_result_balance_sheet: 1},
     denominator: {total_assets: 1}}
  # Altman X3, EBIT / total assets. The operating result stands in for EBIT: the statements do not
  # separate interest from other financial items (see `operating_result_to_financial_costs`).
  # Null for small income statements, which have no operating-result line.
  - {name: ebit_to_assets, family: financial, kind: ratio,
     numerator: {operating_result: 1}, denominator: {total_assets: 1}}
  # Altman X4 for private firms, book equity / total liabilities; liabilities include provisions
  # and accruals (section B), as the statements total them.
  - {name: equity_to_liabilities, family: financial, kind: ratio,
     numerator: {equity: 1}, denominator: {liabilities_and_provisions: 1},
     denominator_rule: positive}
  # Poznań W5, "kapitał stały" / total assets: equity plus long-term liabilities. Null for micro.
  - {name: long_term_capital_to_assets, family: financial, kind: ratio,
     numerator: {equity: 1, long_term_liabilities: 1}, denominator: {total_assets: 1}}
  # Poznań W13, result on sales / sales revenue, each from the layout the statement was filed in.
  - {name: sales_margin, family: financial, kind: ratio,
     numerator: {sales_result: 1}, denominator: {revenue: 1}, denominator_rule: positive}

  # --- disclosures (plan 0013 decision 7) -----------------------------------------------------
  # The introduction's going-concern block, in every mapped structure version: P_5B, stored
  # negated, and P_5A, negated here, so true is the warning in both.
  - {name: going_concern_threat, family: disclosure, kind: disclosure_flag,
     item: going_concern_threat}
  - {name: going_concern_basis_abandoned, family: disclosure, kind: disclosure_flag,
     item: going_concern_basis, negate: true}
  # Wariant 2 only (fiscal years from 2025): null for every earlier statement. A raw feature, like
  # total assets and revenue; the size class waits (plan 0010 decision 4).
  - {name: average_employment, family: disclosure, kind: disclosure_number,
     item: average_employment}

  # --- text in the notes (plan 0013 decision 7) -----------------------------------------------
  # From the notes embedded in the statements (decision 0b). The auditor-report features of the
  # decision (`modified_opinion`, `emphasis_of_matter`) wait for decision 0c: the notes are not
  # where an opinion is given, and a note without one is not an unmodified opinion.
  - {name: going_concern_in_notes, family: text, kind: text_flag,
     signal_type: going_concern_uncertainty}
  - {name: going_concern_in_notes_years, family: text, kind: text_years,
     signal_type: going_concern_uncertainty}
  # Any stated way of covering a loss: the signal does not say from what, so not "by capital".
  - {name: loss_coverage_in_notes, family: text, kind: text_flag,
     signal_type: loss_coverage_resolution}
  - {name: loss_coverage_in_notes_years, family: text, kind: text_years,
     signal_type: loss_coverage_resolution}

  # --- auditor reports (plan 0013 decision 0c) ------------------------------------------------
  # The auditor's opinion, by the report's headings (`rules_v2` and later). Not a statement's
  # notes: a company that is not audited has no report, and its features are null, never "clean".
  # A report speaks until a later one is filed, however old: an entity that stops being audited
  # keeps its last report's values.
  - {name: modified_opinion, family: audit, kind: audit_flag, item: modified_opinion}
  - {name: modified_opinion_years, family: audit, kind: audit_years, item: modified_opinion}
  # The audit firm, told by its number on the list of audit firms and never stored: a firm can be a
  # sole practitioner (owner, 2026-10-05). Keyed on the firm, never the key auditor (decision 7).
  - {name: auditor_changed, family: audit, kind: audit_flag, item: auditor_changed}
  - {name: auditor_changed_years, family: audit, kind: audit_years, item: auditor_changed}
  # The auditor draws attention to a matter without modifying the opinion; read by the model, so
  # null until the owner confirms the provider's terms (decision 2).
  - {name: emphasis_of_matter, family: text, kind: text_flag,
     signal_type: emphasis_of_matter, document_kind: auditor_report}
  - {name: emphasis_of_matter_years, family: text, kind: text_years,
     signal_type: emphasis_of_matter, document_kind: auditor_report}
