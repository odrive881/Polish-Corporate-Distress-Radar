services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-distress_radar}
      POSTGRES_USER: ${POSTGRES_USER:-distress_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-distress_radar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-distress_radar} -d ${POSTGRES_DB:-distress_radar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Docker Hub `minio/minio` was withdrawn; quay.io still serves the upstream
    # image. Pinned to the last community release — `latest` no longer moves.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    # MINIO_BUCKET (.env) is not created here — B1's raw-write path creates it
    # on first use (or `mc mb` ad hoc); Phase 0 only stands the server up.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-distress_radar}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-distress_radar_secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
