name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: make install
      - name: Check (lint, type-check, tests — includes the blocking leakage
          test once tests/features/test_leakage.py exists)
        run: make check
